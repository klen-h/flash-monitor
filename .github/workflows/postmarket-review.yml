name: A股盘后复盘总结

on:
  workflow_dispatch:

jobs:
  postmarket-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 执行盘后复盘
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          WECHAT_WEBHOOK_REVIEW: ${{ secrets.WECHAT_WEBHOOK_REVIEW }}
        run: node scripts/review.js postmarket

      - name: 提交数据（如有更新）
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/
          if ! git diff --staged --quiet; then
            git commit -m "📊 $(TZ='Asia/Shanghai' date +'%m-%d %H:%M') 盘后复盘数据"
            git push
          fi