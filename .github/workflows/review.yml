name: A股盘前盘后复盘

on:
  schedule:
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 确定复盘类型
        id: determine_type
        shell: bash
        run: |
          # 如果是手动触发，使用输入参数
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.review_type }}" >> $GITHUB_OUTPUT
          else
            # 自动触发：根据当前时间判断
            # 获取当前 UTC 小时
            UTC_HOUR=$(date -u +%H)
            # UTC 00:xx = 北京时间 08:xx (盘前)
            # UTC 07:xx = 北京时间 15:xx (盘后)
            if [ "$UTC_HOUR" = "0" ]; then
              echo "type=premarket" >> $GITHUB_OUTPUT
            else
              echo "type=postmarket" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 运行复盘脚本
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_MODEL_COMPARE: ${{ secrets.LLM_MODEL_COMPARE }}
          WECHAT_WEBHOOK_REVIEW: ${{ secrets.WECHAT_WEBHOOK_REVIEW }}
          WECHAT_WEBHOOK_REVIEW_COMPARE: ${{ secrets.WECHAT_WEBHOOK_REVIEW_COMPARE }}
        run: node scripts/review.js
