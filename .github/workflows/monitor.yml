name: 快讯实时监控

on:
  workflow_dispatch:
    inputs:
      llm_model:
        description: '主 LLM 模型名称 (覆盖 Secrets 中的 LLM_MODEL)'
        required: false
        default: ''
      llm_model_compare:
        description: '对比 LLM 模型名称 (留空则不进行对比)'
        required: false
        default: ''

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 运行监控
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ github.event.inputs.llm_model || secrets.LLM_MODEL }}
          LLM_MODEL_COMPARE: ${{ github.event.inputs.llm_model_compare || secrets.LLM_MODEL_COMPARE }}
          FLASH_COOKIE: ${{ secrets.FLASH_COOKIE }}
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          WECHAT_WEBHOOK_COMPARE: ${{ secrets.WECHAT_WEBHOOK_COMPARE }}
        run: node scripts/fetch-flash.js

      - name: 提交数据
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/
          if ! git diff --staged --quiet; then
            git commit -m "⚡ $(TZ='Asia/Shanghai' date +'%m-%d %H:%M') 原油快讯"
            git push
          fi
